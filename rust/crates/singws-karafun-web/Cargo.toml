[package]
name = "singws-karafun-web"
version = "0.1.0"
edition = "2021"
description = "KaraFun through its web player (karafun.com/web) instead of the KaraFun Mac app: a helper that runs Google Chrome without a window, driven over Chrome's DevTools pipe. SingWS (Python) sends JSON-line commands on stdin and reads JSON lines on stdout; picture frames come as JPEG. Experiment: not wired into the show."
publish = false

[[bin]]
name = "singws-karafun-web"
path = "src/main.rs"

[dependencies]
serde_json = "1"
libc = "0.2"
