[package]
name = "singws-queue"
version = "0.1.0"
edition = "2024"
description = "Pure queue/request admission rules for SingWS (no I/O, no clock): host removal is authoritative, ids are permanent, oldest duplicate wins. Shadow-mode reference."
publish = false

[lib]
name = "singws_queue"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
