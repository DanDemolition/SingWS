[package]
name = "singws-bgm"
version = "0.1.0"
edition = "2024"
description = "Device-free, allocation-free two-deck BGM mixer core (sample-accurate equal-power crossfade). Stage 4 groundwork: proves transition quality offline before any audio-device or BASS replacement work."
publish = false

[lib]
name = "singws_bgm"
path = "src/lib.rs"

[[bin]]
name = "singws-bgm-render"
path = "src/render_main.rs"

[dependencies]
# Decoding: the same container/codec set the analyzer already uses.
symphonia = { version = "0.6.1", features = ["mp3", "flac", "wav", "aac", "isomp4", "ogg", "vorbis", "pcm", "alac"] }
# Sample-rate conversion (44.1 kHz files into a 48 kHz engine). Runtime dependency, MIT, pure Rust.
rubato = "5.0.1"
