[package]
name = "singws-analysis"
version = "0.1.0"
edition = "2024"
description = "Prototype: loudness, sample peak and silence-boundary analysis for SingWS library files (not used by the app yet)."
publish = false

[lib]
name = "singws_analysis"
path = "src/lib.rs"

[[bin]]
name = "singws-analyze"
path = "src/main.rs"

[dependencies]
ebur128 = "0.1.10"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["mp3", "flac", "wav", "aac", "isomp4", "ogg", "vorbis", "pcm", "alac"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64"] }
