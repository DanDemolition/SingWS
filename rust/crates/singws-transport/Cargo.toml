[package]
name = "singws-transport"
version = "0.1.0"
edition = "2024"
description = "Pure song-lifecycle state machine for SingWS (no I/O, no clock). Shadow-mode reference for the end-of-song / KaraFun completion rules."
publish = false

[lib]
name = "singws_transport"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
