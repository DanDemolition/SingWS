[package]
name = "singws-karaoke-proto"
version = "0.1.0"
edition = "2024"
description = "Offline harness for the karaoke start/follow protocol state machine of the Rust shell (singws-shell/src/karaoke_proto.rs, included by path so it builds without Qt). Its JSON scenario runner is the Rust side of tools/karaoke_transport_parity.py. Nothing here drives playback."
publish = false

[lib]
name = "singws_karaoke_proto"
path = "src/lib.rs"

[[bin]]
name = "singws-karaoke-proto-cli"
path = "src/cli.rs"

[dependencies]
singws-cdg = { path = "../singws-cdg" }
serde_json = "1"
