[package]
name = "singws-video"
version = "0.1.0"
edition = "2021"
description = "Drop-in Rust replacement for the Objective-C mpv bridge (roadmap item 2). V2: headless control plane."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Runtime only: loads the bundled singws_libmpv.2.dylib (no link-time dependency, no headers needed).
libloading = "0.8"
# Runtime only: folds diacritics when matching an audio output's name (the Objective-C bridge used NSString folding).
unicode-normalization = "0.1"

[build-dependencies]
# Build-time only: compiles the thin Objective-C view shim.
cc = "1"
