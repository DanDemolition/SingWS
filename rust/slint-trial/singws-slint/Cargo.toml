[package]
name = "singws-slint"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
singws-uimodel = { path = "../../crates/singws-uimodel" }
serde_json = "1"
singws-control = { path = "../../crates/singws-control", features = ["tls"] }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "=1.18.1"
